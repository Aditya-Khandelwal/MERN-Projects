<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         body {
            font-family: 'Arial', sans-serif;
            background-color: #e0f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .todo-container {
            background-color: #ffffff;
            width: 500px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .todo-header {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
            margin-bottom: 20px;
            max-height: 250px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: #fafafa;
            border-radius: 8px;
            margin-bottom: 12px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
        }

        .todo-item span {
            font-size: 18px;
            color: #333;
        }

        .todo-item button {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .todo-item button:hover {
            background-color: #fb8c00;
        }

        .input-container {
            display: flex;
            margin-bottom: 20px;
        }

        .input-container input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-right: 10px;
        }

        .input-container button {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #2196f3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .input-container button:hover {
            background-color: #1976d2;
        }

        .doneToDo {
            background-color: gray;
        }

        .doneToDo span {
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <div class="todo-container">
        <div class="todo-header">My To-Do List</div>

        <div class="input-container">
            <input type="text" name="" id="todo-input" placeholder="Enter a new To-do">
            <button id="addToDo">Add To-Do</button>
        </div>
        
        <ul class="todo-list"></ul>
    </div>
</body>
<script>
    var todoInput = document.querySelector("#todo-input");
    var addToDo = document.querySelector("#addToDo");
    var todoList = document.querySelector(".todo-list");

    addToDo.addEventListener(
        'click', addNewToDo
    )
    todoInput.addEventListener(
        'keyup', function(event){
            if(event.key == "Enter"){
                addNewToDo();
            }
        }
    )
    function addNewToDo(){
            if (todoInput.value != "") {
                todoList.innerHTML = todoList.innerHTML + `<li class="todo-item" onclick="selectToDo(this)" oncontextmenu="deleteList(this)">
                                                                <span>${todoInput.value}</span>
                                                                <button onclick="deleteToDo(this)">Delete</button>
                                                            </li>`
                todoInput.value = "";   
            }
        }
    function selectToDo(list){
        list.classList.toggle('donetodo');
    }
    function deleteToDo(listbtn){
        listbtn.parentNode.remove();
    }
    function deleteList(list){
        list.remove();
    }
</script>
</html>
