<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="main-image">
            <img id="mainImg" src="1.jpg" alt="Main Image">
        </div>
        <div class="thumbnails">
            <img src="1.jpg" alt="Image 1" class="thumbnail" onmouseover="changeImage('1.jpg')">
            <img src="2.jpg" alt="Image 2" class="thumbnail" onmouseover="changeImage('2.jpg')">
            <img src="3.jpg" alt="Image 3" class="thumbnail" onmouseover="changeImage('3.jpg')">
            <img src="4.jpg" alt="Image 4" class="thumbnail" onmouseover="changeImage('4.jpg')">
        </div>
    </div>
</body>
<script src="javascript/script.js"></script>

</html>
